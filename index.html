<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1 class="title"><img src="Images/weather-icon.png" alt="">Clima App</h1>
        <input id="get-city" type="text" placeholder="Busca la ciudad aqui">
    </header>
    <main>
        <div class="info-container">
            <h3 class="city-name"></h3>
            <p class="date-info"><span class="day"></span><span class="date"></span></p>
            <h2 class="weather-deg"></h2>
            <h3 class="weather-condition"></h3>
            <h3 class="humidity"></h3>
        </div>
    </main>
    <script src="Script.js"></script>
</body>
</html>
